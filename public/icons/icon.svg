<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1428"/>
      <stop offset="100%" style="stop-color:#101E38"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8613C"/>
      <stop offset="100%" style="stop-color:#F07B4F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- warm accent glow, top-left -->
  <circle cx="150" cy="130" r="170" fill="url(#glow)" opacity="0.35"/>
  <!-- the JapaQuest mark -->
  <text x="236" y="330" font-size="270" text-anchor="middle" fill="#F7F3EA" font-family="Georgia, serif" font-weight="bold">&#955;</text>
  <!-- the plus -->
  <text x="368" y="352" font-size="150" text-anchor="middle" fill="url(#glow)" font-family="Georgia, serif" font-weight="bold">+</text>
  <!-- dotted flight path -->
  <path d="M 90 430 Q 256 380 422 430" stroke="#F7F3EA" stroke-width="6" fill="none" opacity="0.25" stroke-dasharray="2 26" stroke-linecap="round"/>
</svg>
